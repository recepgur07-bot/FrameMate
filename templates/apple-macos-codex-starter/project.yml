name: __MODULE_NAME__
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    macOS: "__MINIMUM_MACOS__"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "__MINIMUM_MACOS__"

targets:
  __MODULE_NAME__:
    type: application
    platform: macOS
    deploymentTarget: "__MINIMUM_MACOS__"
    sources:
      - path: Sources/App
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: "__DISPLAY_NAME__"
        PRODUCT_MODULE_NAME: "__MODULE_NAME__"
        PRODUCT_BUNDLE_IDENTIFIER: "__BUNDLE_IDENTIFIER__"
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "__TEAM_ID__"
        CODE_SIGN_ENTITLEMENTS: App.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
    info:
      path: Resources/Info.plist
    scheme:
      testTargets:
        - __MODULE_NAME__Tests
        - __MODULE_NAME__ProjectTests

  __MODULE_NAME__Tests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "__MINIMUM_MACOS__"
    sources:
      - path: Tests/AppTests
    dependencies:
      - target: __MODULE_NAME__
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "__BUNDLE_IDENTIFIER__.tests"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/__DISPLAY_NAME__.app/Contents/MacOS/__MODULE_NAME__"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"

  __MODULE_NAME__ProjectTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "__MINIMUM_MACOS__"
    sources:
      - path: Tests/ProjectTests
    dependencies:
      - target: __MODULE_NAME__
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "__BUNDLE_IDENTIFIER__.projecttests"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
